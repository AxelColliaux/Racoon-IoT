; PlatformIO Project Configuration for SmartPosture / CorpSafe v1
; Compile puis lancer "Wokwi: Start Simulator" dans VS Code

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.3
    adafruit/Adafruit Unified Sensor@^1.1.14
