; PlatformIO Project Configuration for SmartPosture / CorpSafe v1
; Compile puis lancer "Wokwi: Start Simulator" dans VS Code

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8
