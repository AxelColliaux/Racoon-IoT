<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <title>SmartPosture  Emplacement capteur sur le gilet (vue dos)</title>
  <!-- Gilet vue dos -->
  <path d="M40 40 L80 35 L120 40 L160 35 L200 40 L200 280 L160 300 L120 305 L80 300 L40 280 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <!-- Encolure -->
  <path d="M95 40 L120 45 L145 40 L145 70 L120 75 L95 70 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <!-- Emplacement capteur / MCU entre les omoplates -->
  <rect x="95" y="115" width="50" height="40" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="140" text-anchor="middle" font-size="10" fill="white" font-family="sans-serif">MPU-6050</text>
  <text x="120" y="152" text-anchor="middle" font-size="8" fill="white" font-family="sans-serif">+ MCU</text>
  <!-- Axes X Y Z -->
  <line x1="120" y1="155" x2="155" y2="155" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="155" x2="85" y2="155" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="120" y1="155" x2="120" y2="115" stroke="#3b82f6" stroke-width="1.5"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <text x="165" y="158" font-size="9" fill="#ef4444">X</text>
  <text x="75" y="158" font-size="9" fill="#22c55e">Y</text>
  <text x="122" y="108" font-size="9" fill="#3b82f6">Z</text>
  <!-- Légende -->
  <text x="120" y="290" text-anchor="middle" font-size="11" fill="#334155" font-family="sans-serif">Vue dos  Capteur entre les omoplates</text>
</svg>
